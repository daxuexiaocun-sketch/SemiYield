name: Update star history

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"
  push:
    paths:
      - .github/workflows/star-history.yml
      - scripts/update_star_history.py
      - src/semiyield/star_history.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: write

concurrency:
  group: star-history-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Generate deterministic history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run --locked python scripts/update_star_history.py
      - name: Commit only changed history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- docs/assets/star-history.json docs/assets/star-history.svg
          if git diff --cached --quiet -- docs/assets/star-history.json docs/assets/star-history.svg; then
            echo "Star history is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update star history" -- docs/assets/star-history.json docs/assets/star-history.svg
          git push origin "HEAD:$DEFAULT_BRANCH"
