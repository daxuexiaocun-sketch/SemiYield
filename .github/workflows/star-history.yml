name: Update star history

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'daxuexiaocun-sketch/SemiYield'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate deterministic history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_star_history.py
      - name: Commit only changed history
        run: |
          if git diff --quiet -- docs/assets/star-history.json docs/assets/star-history.svg; then
            echo "Star history is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/star-history.json docs/assets/star-history.svg
          git commit -m "Update star history"
          git push
