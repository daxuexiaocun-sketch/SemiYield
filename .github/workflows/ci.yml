name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra charts --extra survival
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked pytest --cov=semiyield --cov-report=term-missing
      - run: uv build
      - run: uv run --locked python -I scripts/update_star_history.py --help

  reference-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra charts --extra survival
      - run: uv run --locked semiyield reliability example install
      - run: uv run --locked semiyield reliability report --profile quick
      - uses: actions/upload-artifact@v4
        with:
          name: semiyield-reliability-smoke-reports
          path: reports/reference
