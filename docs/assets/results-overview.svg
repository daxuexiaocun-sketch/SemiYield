<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">SemiYield three-route results overview</title><desc id="desc">Published aggregate results and evidence boundaries for manufacturing yield, packaging proxy failure, and NASA MOSFET device lifetime.</desc><rect width="1600" height="720" fill="#f5f8fc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="60" y="70" font-size="36" font-weight="700">SemiYield · Results overview</text><text x="60" y="105" font-size="18" fill="#516174">Published aggregate results keep measured evidence, proxy labels, and lifetime inference distinct.</text><g stroke="#d7e0ec" stroke-width="2" fill="#fff"><rect x="55" y="150" width="470" height="460" rx="18"/><rect x="565" y="150" width="470" height="460" rx="18"/><rect x="1075" y="150" width="470" height="460" rx="18"/></g><g font-size="18"><text x="85" y="195" fill="#2878b5" font-weight="700">01 · MANUFACTURING</text><text x="85" y="226" fill="#516174">measured SECOM evidence</text><text x="85" y="274" font-size="31" font-weight="700">PR-AUC 0.167</text><text x="85" y="316">CatBoost repeated CV</text><text x="85" y="344">10% review capture 0.269</text><text x="85" y="419" fill="#516174">Boundary: process-risk screening,</text><text x="85" y="446" fill="#516174">not causal diagnosis.</text><text x="595" y="195" fill="#d47832" font-weight="700">02 · PACKAGING</text><text x="595" y="226" fill="#516174">low-throughput proxy failure</text><text x="595" y="274" font-size="31" font-weight="700">PR-AUC 0.967</text><text x="595" y="316">CatBoost · random three-fold</text><text x="595" y="344">internal validation</text><text x="595" y="419" fill="#516174">Boundary: operational proxy, not</text><text x="595" y="446" fill="#516174">physical failure or new-batch proof.</text><text x="1105" y="195" fill="#4f8f6b" font-weight="700">03 · DEVICE LIFETIME</text><text x="1105" y="226" fill="#516174">NASA MOSFET stress evidence</text><text x="1105" y="274" font-size="31" font-weight="700">B10 1,079 s</text><text x="1105" y="316">Weibull β 0.880 · η 13,897 s</text><text x="1105" y="344">right-censored lifetime analysis</text><text x="1105" y="419" fill="#516174">Boundary: use-temperature results</text><text x="1105" y="446" fill="#516174">are model estimates requiring validation.</text></g><rect x="55" y="650" width="1490" height="30" rx="12" fill="#172f4b"/><text x="75" y="672" font-size="15" fill="#fff">Details: reports/verified/ · methods, source hashes, and aggregate-only static artifacts</text></g></svg>
