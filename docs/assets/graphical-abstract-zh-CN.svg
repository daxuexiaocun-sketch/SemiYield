<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">SemiYield 四线路详细技术流程图</title>
<desc id="desc">制造良率、封测低吞吐代理失效、器件寿命和三阶段合成演示的流程图。每条线路展示输入、处理或标签、方法、输出和证据边界。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#91a3b8"/></marker></defs>
<rect width="1600" height="1000" fill="#f5f8fc"/>
<g font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#172033">
<text x="58" y="66" font-size="38" font-weight="700">SemiYield · 四线路详细技术流程</text><text x="58" y="103" font-size="18" fill="#516174">每条线路独立呈现证据、处理、方法、输出与边界；第四条线路用 synthetic 数据验证跨阶段流转。</text>
<g fill="#fff" stroke="#d7e0ec" stroke-width="2"><rect x="42" y="145" width="350" height="710" rx="20"/><rect x="426" y="145" width="350" height="710" rx="20"/><rect x="810" y="145" width="350" height="710" rx="20"/><rect x="1194" y="145" width="350" height="710" rx="20"/></g>
<g font-size="16">
<text x="68" y="187" font-size="20" font-weight="700" fill="#2878b5">01 · 制造良率</text><text x="68" y="216" fill="#516174">SECOM 真实工艺证据</text><rect x="68" y="245" width="298" height="86" rx="12" fill="#e8f2fb"/><text x="84" y="275" font-weight="700">输入</text><text x="84" y="303">SECOM 传感器 · 时间戳 · 失效标签</text><path d="M217 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="68" y="370" width="298" height="100" rx="12" fill="#edf5fb"/><text x="84" y="400" font-weight="700">清洗与特征</text><text x="84" y="428">模式/质量校验 · 缺失值处理</text><text x="84" y="452">仅训练集特征筛选和缩放</text><path d="M217 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="68" y="509" width="298" height="100" rx="12" fill="#e8f2fb"/><text x="84" y="539" font-weight="700">建模与评估</text><text x="84" y="567">Dummy / 逻辑回归 / 可选 CatBoost</text><text x="84" y="591">交叉验证 · 校准 · 复检预算阈值</text><path d="M217 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="68" y="648" width="298" height="100" rx="12" fill="#e8f2fb"/><text x="84" y="678" font-weight="700">审阅输出</text><text x="84" y="706">风险排序 · PR-AUC · 召回率 · MCC</text><text x="84" y="730">漂移检测和特征解释</text><text x="68" y="806" fill="#516174">边界：用于风险筛查，不构成因果根因证明。</text>
<text x="452" y="187" font-size="20" font-weight="700" fill="#d47832">02 · 封测过程</text><text x="452" y="216" fill="#516174">吞吐率运营代理指标</text><rect x="452" y="245" width="298" height="86" rx="12" fill="#fcf0e7"/><text x="468" y="275" font-weight="700">输入</text><text x="468" y="303">本地 X1–X16 设置 · 吞吐率 Y</text><path d="M601 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="452" y="370" width="298" height="100" rx="12" fill="#fdf4ed"/><text x="468" y="400" font-weight="700">处理与标签</text><text x="468" y="428">混合类型填补 · 缩放 · 独热编码</text><text x="468" y="452">Y &lt; 训练集 10% 吞吐阈值 → 代理失效</text><path d="M601 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="452" y="509" width="298" height="100" rx="12" fill="#fcf0e7"/><text x="468" y="539" font-weight="700">建模与评估</text><text x="468" y="567">共享随机三折外层切分</text><text x="468" y="591">Dummy / 逻辑回归 / 可选 CatBoost</text><path d="M601 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="452" y="648" width="298" height="100" rx="12" fill="#fcf0e7"/><text x="468" y="678" font-weight="700">审阅输出</text><text x="468" y="706">代理概率 · PR/ROC · F1 · MCC</text><text x="468" y="730">阈值溯源和混淆矩阵指标</text><text x="452" y="806" fill="#516174">边界：代理标签，不等同器件物理失效。</text>
<text x="836" y="187" font-size="20" font-weight="700" fill="#4f8f6b">03 · 器件寿命</text><text x="836" y="216" fill="#516174">NASA / MOSFET 可靠性证据</text><rect x="836" y="245" width="298" height="86" rx="12" fill="#eaf5ed"/><text x="852" y="275" font-weight="700">输入</text><text x="852" y="303">退化轨迹 · 应力温度 · 右删失</text><path d="M985 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="836" y="370" width="298" height="100" rx="12" fill="#f0f8f2"/><text x="852" y="400" font-weight="700">处理</text><text x="852" y="428">来源审计 · 时间/事件字段校验</text><text x="852" y="452">器件隔离切分和应力温度分组</text><path d="M985 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="836" y="509" width="298" height="100" rx="12" fill="#eaf5ed"/><text x="852" y="539" font-weight="700">拟合与评估</text><text x="852" y="567">Weibull · Arrhenius-Weibull</text><text x="852" y="591">满足条件时使用生存森林</text><path d="M985 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="836" y="648" width="298" height="100" rx="12" fill="#eaf5ed"/><text x="852" y="678" font-weight="700">审阅输出</text><text x="852" y="706">B10 · β · η · 生存曲线</text><text x="852" y="730">应力范围和外推限制</text><text x="836" y="806" fill="#516174">边界：机理与应力范围假设始终明确。</text>
<text x="1220" y="187" font-size="20" font-weight="700" fill="#7654b8">04 · 三阶段合成演示</text><text x="1220" y="216" fill="#516174">批次隔离的贯通验证</text><rect x="1220" y="245" width="298" height="86" rx="12" fill="#f0ebfa"/><text x="1236" y="275" font-weight="700">生成</text><text x="1236" y="303">固定种子批次 · 器件 ID · 原始阶段观测</text><path d="M1369 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1220" y="370" width="298" height="100" rx="12" fill="#f6f1fc"/><text x="1236" y="400" font-weight="700">按观测流转</text><text x="1236" y="428">制造通过 → 封测候选</text><text x="1236" y="452">训练期阈值 → 封测通过 → 寿命队列</text><path d="M1369 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1220" y="509" width="298" height="100" rx="12" fill="#f0ebfa"/><text x="1236" y="539" font-weight="700">预测结果不驱动流转</text><text x="1236" y="567">同一批次切分贯穿三个阶段</text><text x="1236" y="591">留出集分类器 · Weibull / Arrhenius</text><path d="M1369 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1220" y="648" width="298" height="100" rx="12" fill="#f0ebfa"/><text x="1236" y="678" font-weight="700">静态报告</text><text x="1236" y="706">漏斗 · 阈值 · 模型对比</text><text x="1236" y="730">生存曲线 · 聚合哈希</text><text x="1220" y="806" fill="#516174">边界：synthetic，不代表真实实验结论。</text>
</g>
<rect x="42" y="888" width="1502" height="72" rx="16" fill="#172f4b"/><g fill="#fff"><text x="72" y="920" font-size="19" font-weight="700">共享工程平台</text><text x="72" y="947" font-size="17">uv.lock · 数据契约 · 训练期隔离 · 输入与产物哈希 · 受管输出 · 资源保护 · 双语 Streamlit 审阅</text></g>
</g></svg>
