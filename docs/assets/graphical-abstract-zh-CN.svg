<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">SemiYield 三路线技术流程</title>
  <desc id="desc">三条横向流程分别将 SECOM 制造数据、封测过程数据和 NASA MOSFET 寿命数据连接到无泄漏分析及可审计工程输出。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#155eef"/><stop offset="1" stop-color="#7a5af8"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667085"/></marker>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#d0d5dd;stroke-width:1.5}.mfg{fill:#eff8ff;stroke:#84caff}.pkg{fill:#fff4ed;stroke:#f7b27d}.life{fill:#f4f3ff;stroke:#bdb4fe}.out{fill:#ecfdf3;stroke:#6ce9a6}.h{font:700 22px system-ui,"Microsoft YaHei",sans-serif;fill:#fff}.lane{font:700 20px system-ui,"Microsoft YaHei",sans-serif;fill:#101828}.tag{font:600 13px system-ui,"Microsoft YaHei",sans-serif;fill:#667085}.t{font:600 16px system-ui,"Microsoft YaHei",sans-serif;fill:#101828}.s{font:14px system-ui,"Microsoft YaHei",sans-serif;fill:#475467}.arrow{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){.bg{fill:#0d1117}.card{fill:#161b22;stroke:#3d444d}.mfg{fill:#102a43;stroke:#388bfd}.pkg{fill:#3b2518;stroke:#db6d28}.life{fill:#26204d;stroke:#8957e5}.out{fill:#123524;stroke:#2ea043}.lane,.t{fill:#e6edf3}.tag,.s{fill:#b1bac4}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800" rx="18"/>
  <rect width="1200" height="72" rx="18" fill="url(#header)"/><rect y="52" width="1200" height="20" fill="url(#header)"/>
  <text class="h" x="42" y="44">SemiYield · 三条可审计的半导体分析路线</text>

  <text class="lane" x="42" y="108">制造良率风险筛查</text>
  <text class="tag" x="1158" y="108" text-anchor="end">SECOM 实测证据</text>
  <rect class="mfg" x="42" y="126" width="220" height="142" rx="14"/>
  <text class="t" x="62" y="157">输入</text><text class="s" x="62" y="185">SECOM 传感器变量</text><text class="s" x="62" y="207">时间戳与失效标签</text><text class="s" x="62" y="229">少数类失效、类别不平衡</text>
  <path class="arrow" d="M274 197H326"/>
  <rect class="card" x="338" y="126" width="230" height="142" rx="14"/>
  <text class="t" x="358" y="157">无泄漏数据处理</text><text class="s" x="358" y="185">质量校验与缺失值填补</text><text class="s" x="358" y="207">仅训练集内特征筛选</text><text class="s" x="358" y="229">在每次切分内完成缩放</text>
  <path class="arrow" d="M580 197H632"/>
  <rect class="card" x="644" y="126" width="230" height="142" rx="14"/>
  <text class="t" x="664" y="157">模型与评估</text><text class="s" x="664" y="185">Dummy · 逻辑回归 · CatBoost</text><text class="s" x="664" y="207">重复交叉验证与时间外推</text><text class="s" x="664" y="229">概率校准与复检预算阈值</text>
  <path class="arrow" d="M886 197H938"/>
  <rect class="out" x="950" y="126" width="208" height="142" rx="14"/>
  <text class="t" x="970" y="157">工程输出</text><text class="s" x="970" y="185">失效风险排序</text><text class="s" x="970" y="207">PR-AUC · 召回率 · MCC</text><text class="s" x="970" y="229">固定预算复检捕获率</text>

  <text class="lane" x="42" y="333">封测过程筛查</text>
  <text class="tag" x="1158" y="333" text-anchor="end">低吞吐代理标签</text>
  <rect class="pkg" x="42" y="351" width="220" height="142" rx="14"/>
  <text class="t" x="62" y="382">输入</text><text class="s" x="62" y="410">匿名 X1–X16 工艺变量</text><text class="s" x="62" y="432">类别与数值混合特征</text><text class="s" x="62" y="454">观测吞吐量 Y</text>
  <path class="arrow" d="M274 422H326"/>
  <rect class="card" x="338" y="351" width="230" height="142" rx="14"/>
  <text class="t" x="358" y="382">数据处理与标签</text><text class="s" x="358" y="410">填补 · 缩放 · 独热编码</text><text class="s" x="358" y="432">每个训练折的第 10 百分位</text><text class="s" x="358" y="454">定义低吞吐代理失效</text>
  <path class="arrow" d="M580 422H632"/>
  <rect class="card" x="644" y="351" width="230" height="142" rx="14"/>
  <text class="t" x="664" y="382">模型与评估</text><text class="s" x="664" y="410">Dummy · 逻辑回归 · CatBoost</text><text class="s" x="664" y="432">随机三折内部验证</text><text class="s" x="664" y="454">PR-AUC 与分类指标</text>
  <path class="arrow" d="M886 422H938"/>
  <rect class="out" x="950" y="351" width="208" height="142" rx="14"/>
  <text class="t" x="970" y="382">代理任务输出</text><text class="s" x="970" y="410">代理失效概率</text><text class="s" x="970" y="432">PR-AUC · F1 · MCC</text><text class="s" x="970" y="454">标签阈值溯源</text>

  <text class="lane" x="42" y="558">器件寿命分析</text>
  <text class="tag" x="1158" y="558" text-anchor="end">NASA MOSFET 应力证据</text>
  <rect class="life" x="42" y="576" width="220" height="142" rx="14"/>
  <text class="t" x="62" y="607">输入</text><text class="s" x="62" y="635">MOSFET 退化轨迹</text><text class="s" x="62" y="657">应力温度</text><text class="s" x="62" y="679">失效事件与右删失</text>
  <path class="arrow" d="M274 647H326"/>
  <rect class="card" x="338" y="576" width="230" height="142" rx="14"/>
  <text class="t" x="358" y="607">可靠性数据处理</text><text class="s" x="358" y="635">来源、时间和事件审查</text><text class="s" x="358" y="657">器件级隔离切分</text><text class="s" x="358" y="679">温度应力分组</text>
  <path class="arrow" d="M580 647H632"/>
  <rect class="card" x="644" y="576" width="230" height="142" rx="14"/>
  <text class="t" x="664" y="607">模型与评估</text><text class="s" x="664" y="635">Weibull · Arrhenius–Weibull</text><text class="s" x="664" y="657">随机生存森林 RSF</text><text class="s" x="664" y="679">拟合评估与留出集指标</text>
  <path class="arrow" d="M886 647H938"/>
  <rect class="out" x="950" y="576" width="208" height="142" rx="14"/>
  <text class="t" x="970" y="607">可靠性输出</text><text class="s" x="970" y="635">B10 · η · 生存预测</text><text class="s" x="970" y="657">使用温度寿命估计</text><text class="s" x="970" y="679">RSF 预测性能指标</text>
</svg>
