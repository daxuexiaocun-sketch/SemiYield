<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc">
<title id="title">SemiYield three business workflows</title>
<desc id="desc">Manufacturing yield, packaging proxy failure, device lifetime; a separate synthetic demo links batch and device identities.</desc>
<rect width="1080" height="340" rx="20" fill="#f1f5f9"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="45" y="48" font-size="26" font-weight="bold">SemiYield</text>
<rect x="45" y="82" width="305" height="126" rx="12" fill="#ffffff" stroke="#b7c9de"/>
<text x="65" y="124" font-size="23" font-weight="bold">Manufacturing yield</text>
<text x="65" y="165" font-size="16">SECOM risk screening</text>
<text x="357" y="152" font-size="24">→</text>
<rect x="385" y="82" width="305" height="126" rx="12" fill="#ffffff" stroke="#b7c9de"/>
<text x="405" y="124" font-size="23" font-weight="bold">Packaging process</text>
<text x="405" y="165" font-size="16">Low-throughput proxy failure</text>
<text x="697" y="152" font-size="24">→</text>
<rect x="725" y="82" width="305" height="126" rx="12" fill="#ffffff" stroke="#b7c9de"/>
<text x="745" y="124" font-size="23" font-weight="bold">Device lifetime</text>
<text x="745" y="165" font-size="16">MOSFET survival analysis</text>
<text x="45" y="262" font-size="19">Synthetic demo: shared batch/device IDs · isolated evaluation · static reports</text>
<text x="45" y="301" font-size="16">Shared infrastructure: metrics, schemas, artifacts, resource protection · uv.lock</text>
</g></svg>
