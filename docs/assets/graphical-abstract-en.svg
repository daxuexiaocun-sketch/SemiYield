<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">SemiYield detailed three-route workflow</title>
<desc id="desc">A flowchart for manufacturing yield, packaging proxy failure, and device lifetime. Each route shows input, preparation, method, output, and evidence boundary.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#91a3b8"/></marker></defs><rect width="1600" height="1000" fill="#f5f8fc"/>
<g font-family="Arial, sans-serif" fill="#172033"><text x="58" y="66" font-size="38" font-weight="700">SemiYield · detailed three-route workflow</text><text x="58" y="103" font-size="18" fill="#516174">Each route states its evidence, transformation, method, output, and decision boundary.</text>
<g fill="#fff" stroke="#d7e0ec" stroke-width="2"><rect x="42" y="145" width="470" height="710" rx="20"/><rect x="565" y="145" width="470" height="710" rx="20"/><rect x="1088" y="145" width="470" height="710" rx="20"/></g>
<g font-size="17">
<text x="70" y="187" font-size="21" font-weight="700" fill="#2878b5">01 · MANUFACTURING YIELD</text><text x="70" y="216" fill="#516174">Real SECOM process evidence</text><rect x="70" y="245" width="414" height="86" rx="12" fill="#e8f2fb"/><text x="88" y="275" font-weight="700">Input</text><text x="88" y="304">SECOM sensors · timestamps · failure labels</text><path d="M277 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="370" width="414" height="100" rx="12" fill="#edf5fb"/><text x="88" y="400" font-weight="700">Prepare</text><text x="88" y="428">Schema and quality checks · missing-value handling</text><text x="88" y="452">Training-only feature selection and scaling</text><path d="M277 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="509" width="414" height="100" rx="12" fill="#e8f2fb"/><text x="88" y="539" font-weight="700">Model and evaluate</text><text x="88" y="567">Dummy · logistic · optional CatBoost</text><text x="88" y="591">CV · calibration · inspection-budget threshold</text><path d="M277 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="648" width="414" height="100" rx="12" fill="#e8f2fb"/><text x="88" y="678" font-weight="700">Review output</text><text x="88" y="706">Risk ranking · PR-AUC · recall · MCC</text><text x="88" y="730">Drift monitoring and feature explanation</text><text x="70" y="796" fill="#516174">Boundary: screening, not root-cause proof.</text>
<text x="593" y="187" font-size="21" font-weight="700" fill="#d47832">02 · PACKAGING PROCESS</text><text x="593" y="216" fill="#516174">Operational throughput proxy</text><rect x="593" y="245" width="414" height="86" rx="12" fill="#fcf0e7"/><text x="611" y="275" font-weight="700">Input</text><text x="611" y="304">Local X1–X16 settings · throughput Y</text><path d="M800 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="593" y="370" width="414" height="100" rx="12" fill="#fdf4ed"/><text x="611" y="400" font-weight="700">Prepare and label</text><text x="611" y="428">Mixed-type imputation · scaling · one-hot encoding</text><text x="611" y="452">Y below training-only 10th percentile</text><text x="611" y="466">→ proxy failure</text><path d="M800 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="593" y="509" width="414" height="100" rx="12" fill="#fcf0e7"/><text x="611" y="539" font-weight="700">Model and evaluate</text><text x="611" y="567">Matched random three-fold outer splits</text><text x="611" y="591">Dummy · logistic · optional CatBoost</text><path d="M800 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="593" y="648" width="414" height="100" rx="12" fill="#fcf0e7"/><text x="611" y="678" font-weight="700">Review output</text><text x="611" y="706">Proxy probability · PR/ROC · F1 · MCC</text><text x="611" y="730">Threshold provenance and confusion metrics</text><text x="593" y="796" fill="#516174">Boundary: proxy label, not physical device failure.</text>
<text x="1116" y="187" font-size="21" font-weight="700" fill="#4f8f6b">03 · DEVICE LIFETIME</text><text x="1116" y="216" fill="#516174">NASA MOSFET reliability evidence</text><rect x="1116" y="245" width="414" height="86" rx="12" fill="#eaf5ed"/><text x="1134" y="275" font-weight="700">Input</text><text x="1134" y="304">Degradation trajectories · temperature · censoring</text><path d="M1323 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1116" y="370" width="414" height="100" rx="12" fill="#f0f8f2"/><text x="1134" y="400" font-weight="700">Prepare</text><text x="1134" y="428">Audit source · validate time and event fields</text><text x="1134" y="452">Device-isolated partitions and stress groups</text><path d="M1323 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1116" y="509" width="414" height="100" rx="12" fill="#eaf5ed"/><text x="1134" y="539" font-weight="700">Fit and assess</text><text x="1134" y="567">Weibull · Arrhenius–Weibull · required RSF</text><text x="1134" y="591">Explicit unavailable state when conditions fail</text><path d="M1323 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1116" y="648" width="414" height="100" rx="12" fill="#eaf5ed"/><text x="1134" y="678" font-weight="700">Review output</text><text x="1134" y="706">B10 · beta · eta · survival predictions</text><text x="1134" y="730">Stress range and extrapolation limits</text><text x="1116" y="796" fill="#516174">Boundary: assumptions remain explicit.</text></g>
<rect x="42" y="888" width="1516" height="72" rx="16" fill="#172f4b"/><g fill="#fff"><text x="72" y="916" font-size="19" font-weight="700">Shared engineering platform</text><text x="72" y="941" font-size="15">uv.lock · data contracts · training-only isolation · input and artifact hashes</text><text x="72" y="958" font-size="15">managed outputs · resource protection · bilingual Streamlit review</text></g></g></svg>
