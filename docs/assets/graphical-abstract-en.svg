<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">SemiYield detailed four-route workflow</title>
<desc id="desc">A flowchart for manufacturing yield, packaging proxy failure, device lifetime, and the linked synthetic three-stage demonstration. Each route shows input, preparation, methods, outputs, and evidence boundary.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#91a3b8"/></marker></defs>
<rect width="1600" height="1000" fill="#f5f8fc"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="58" y="66" font-size="38" font-weight="700">SemiYield · detailed four-route workflow</text><text x="58" y="103" font-size="18" fill="#516174">Each route states its evidence, transformation, method, output and decision boundary. The fourth route validates the cross-stage flow with synthetic data.</text>
<g fill="#fff" stroke="#d7e0ec" stroke-width="2"><rect x="42" y="145" width="350" height="710" rx="20"/><rect x="426" y="145" width="350" height="710" rx="20"/><rect x="810" y="145" width="350" height="710" rx="20"/><rect x="1194" y="145" width="350" height="710" rx="20"/></g>
<g font-size="10">
<text x="68" y="187" font-size="20" font-weight="700" fill="#2878b5">01 · MANUFACTURING YIELD</text><text x="68" y="216" fill="#516174">Real SECOM process evidence</text>
<rect x="68" y="245" width="298" height="86" rx="12" fill="#e8f2fb"/><text x="84" y="275" font-weight="700">Input</text><text x="84" y="303">SECOM sensors · timestamps · failure labels</text><path d="M217 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="68" y="370" width="298" height="100" rx="12" fill="#edf5fb"/><text x="84" y="400" font-weight="700">Prepare</text><text x="84" y="428">Schema / quality checks · missing-value handling</text><text x="84" y="452">Training-only feature selection and scaling</text><path d="M217 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="68" y="509" width="298" height="100" rx="12" fill="#e8f2fb"/><text x="84" y="539" font-weight="700">Model and evaluate</text><text x="84" y="567">Dummy / logistic / optional CatBoost</text><text x="84" y="591">CV · calibration · inspection-budget threshold</text><path d="M217 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="68" y="648" width="298" height="100" rx="12" fill="#e8f2fb"/><text x="84" y="678" font-weight="700">Review output</text><text x="84" y="706">Risk ranking · PR-AUC · recall · MCC</text><text x="84" y="730">Drift monitoring and feature explanation</text><text x="68" y="806" fill="#516174">Boundary: screening; not root-cause proof.</text>
<text x="452" y="187" font-size="20" font-weight="700" fill="#d47832">02 · PACKAGING PROCESS</text><text x="452" y="216" fill="#516174">Operational throughput proxy</text>
<rect x="452" y="245" width="298" height="86" rx="12" fill="#fcf0e7"/><text x="468" y="275" font-weight="700">Input</text><text x="468" y="303">Local X1–X16 settings · throughput Y</text><path d="M601 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="452" y="370" width="298" height="100" rx="12" fill="#fdf4ed"/><text x="468" y="400" font-weight="700">Prepare and label</text><text x="468" y="428">Mixed-type imputation · scaling · one-hot encoding</text><text x="468" y="452">Y &lt; training-only 10% threshold → proxy failure</text><path d="M601 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="452" y="509" width="298" height="100" rx="12" fill="#fcf0e7"/><text x="468" y="539" font-weight="700">Model and evaluate</text><text x="468" y="567">Matched random three-fold outer splits</text><text x="468" y="591">Dummy / logistic / optional CatBoost</text><path d="M601 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="452" y="648" width="298" height="100" rx="12" fill="#fcf0e7"/><text x="468" y="678" font-weight="700">Review output</text><text x="468" y="706">Proxy probability · PR/ROC · F1 · MCC</text><text x="468" y="730">Threshold provenance and confusion metrics</text><text x="452" y="806" fill="#516174">Boundary: proxy label; not physical device failure.</text>
<text x="836" y="187" font-size="20" font-weight="700" fill="#4f8f6b">03 · DEVICE LIFETIME</text><text x="836" y="216" fill="#516174">NASA / MOSFET reliability evidence</text>
<rect x="836" y="245" width="298" height="86" rx="12" fill="#eaf5ed"/><text x="852" y="275" font-weight="700">Input</text><text x="852" y="303">Degradation trajectories · temperature · censoring</text><path d="M985 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="836" y="370" width="298" height="100" rx="12" fill="#f0f8f2"/><text x="852" y="400" font-weight="700">Prepare</text><text x="852" y="428">Audit source · validate time/event fields</text><text x="852" y="452">Device-isolated partitions and stress groups</text><path d="M985 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="836" y="509" width="298" height="100" rx="12" fill="#eaf5ed"/><text x="852" y="539" font-weight="700">Fit and assess</text><text x="852" y="567">Weibull · Arrhenius-Weibull</text><text x="852" y="591">Required RSF; explicit unavailable state</text><path d="M985 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="836" y="648" width="298" height="100" rx="12" fill="#eaf5ed"/><text x="852" y="678" font-weight="700">Review output</text><text x="852" y="706">B10 · beta · eta · survival curve</text><text x="852" y="730">Stress range and extrapolation limits</text><text x="836" y="806" fill="#516174">Boundary: assumptions remain explicit.</text>
<text x="1220" y="187" font-size="20" font-weight="700" fill="#7654b8">04 · SYNTHETIC DEMO</text><text x="1220" y="216" fill="#516174">Batch-isolated integration validation</text>
<rect x="1220" y="245" width="298" height="86" rx="12" fill="#f0ebfa"/><text x="1236" y="275" font-weight="700">Generate</text><text x="1236" y="303">Seeded batches · linked unit IDs · raw observations</text><path d="M1369 331v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1220" y="370" width="298" height="100" rx="12" fill="#f6f1fc"/><text x="1236" y="400" font-weight="700">Route observed outcomes</text><text x="1236" y="428">Manufacturing pass → packaging candidate</text><text x="1236" y="452">Training threshold → packaging pass → lifetime cohort</text><path d="M1369 470v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1220" y="509" width="298" height="100" rx="12" fill="#f0ebfa"/><text x="1236" y="539" font-weight="700">Evaluate without routing by model</text><text x="1236" y="567">One batch split across all stages</text><text x="1236" y="591">Holdout classifiers · Weibull / Arrhenius</text><path d="M1369 609v28" stroke="#91a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1220" y="648" width="298" height="100" rx="12" fill="#f0ebfa"/><text x="1236" y="678" font-weight="700">Static report</text><text x="1236" y="706">Funnel · threshold · model comparison</text><text x="1236" y="730">Survival curve · aggregate hashes</text><text x="1220" y="806" fill="#516174">Boundary: synthetic, never an experimental result.</text>
</g>
<rect x="42" y="888" width="1502" height="72" rx="16" fill="#172f4b"/><g fill="#fff"><text x="72" y="920" font-size="19" font-weight="700">Shared engineering platform</text><text x="72" y="947" font-size="17">uv.lock · data contracts · training-only isolation · input and artifact hashes · managed outputs · resource protection · bilingual Streamlit review</text></g>
</g></svg>
