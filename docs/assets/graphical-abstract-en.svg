<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">SemiYield three-route technical workflow</title>
  <desc id="desc">Three horizontal workflows connect SECOM manufacturing data, packaging process data, and NASA MOSFET lifetime data to leakage-safe analysis and auditable engineering outputs.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#155eef"/><stop offset="1" stop-color="#7a5af8"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667085"/></marker>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#d0d5dd;stroke-width:1.5}.mfg{fill:#eff8ff;stroke:#84caff}.pkg{fill:#fff4ed;stroke:#f7b27d}.life{fill:#f4f3ff;stroke:#bdb4fe}.out{fill:#ecfdf3;stroke:#6ce9a6}.h{font:700 22px system-ui,sans-serif;fill:#fff}.lane{font:700 20px system-ui,sans-serif;fill:#101828}.tag{font:600 13px system-ui,sans-serif;fill:#667085}.t{font:600 16px system-ui,sans-serif;fill:#101828}.s{font:14px system-ui,sans-serif;fill:#475467}.arrow{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){.bg{fill:#0d1117}.card{fill:#161b22;stroke:#3d444d}.mfg{fill:#102a43;stroke:#388bfd}.pkg{fill:#3b2518;stroke:#db6d28}.life{fill:#26204d;stroke:#8957e5}.out{fill:#123524;stroke:#2ea043}.lane,.t{fill:#e6edf3}.tag,.s{fill:#b1bac4}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800" rx="18"/>
  <rect width="1200" height="72" rx="18" fill="url(#header)"/><rect y="52" width="1200" height="20" fill="url(#header)"/>
  <text class="h" x="42" y="44">SemiYield · Three auditable semiconductor analysis routes</text>

  <text class="lane" x="42" y="108">Manufacturing yield-risk screening</text>
  <text class="tag" x="1158" y="108" text-anchor="end">Measured SECOM evidence</text>
  <rect class="mfg" x="42" y="126" width="220" height="142" rx="14"/>
  <text class="t" x="62" y="157">Input</text><text class="s" x="62" y="185">SECOM sensor variables</text><text class="s" x="62" y="207">Timestamps and failure labels</text><text class="s" x="62" y="229">Rare, imbalanced failures</text>
  <path class="arrow" d="M274 197H326"/>
  <rect class="card" x="338" y="126" width="230" height="142" rx="14"/>
  <text class="t" x="358" y="157">Leakage-safe processing</text><text class="s" x="358" y="185">Quality checks and imputation</text><text class="s" x="358" y="207">Train-only feature selection</text><text class="s" x="358" y="229">Scaling inside each split</text>
  <path class="arrow" d="M580 197H632"/>
  <rect class="card" x="644" y="126" width="230" height="142" rx="14"/>
  <text class="t" x="664" y="157">Models and evaluation</text><text class="s" x="664" y="185">Dummy · Logistic · CatBoost</text><text class="s" x="664" y="207">Repeated and temporal CV</text><text class="s" x="664" y="229">Calibration · review threshold</text>
  <path class="arrow" d="M886 197H938"/>
  <rect class="out" x="950" y="126" width="208" height="142" rx="14"/>
  <text class="t" x="970" y="157">Engineering outputs</text><text class="s" x="970" y="185">Failure-risk ranking</text><text class="s" x="970" y="207">PR-AUC · recall · MCC</text><text class="s" x="970" y="229">Review-budget capture</text>

  <text class="lane" x="42" y="333">Packaging process screening</text>
  <text class="tag" x="1158" y="333" text-anchor="end">Low-throughput proxy label</text>
  <rect class="pkg" x="42" y="351" width="220" height="142" rx="14"/>
  <text class="t" x="62" y="382">Input</text><text class="s" x="62" y="410">Anonymous X1–X16 variables</text><text class="s" x="62" y="432">Mixed categorical / numerical</text><text class="s" x="62" y="454">Observed throughput Y</text>
  <path class="arrow" d="M274 422H326"/>
  <rect class="card" x="338" y="351" width="230" height="142" rx="14"/>
  <text class="t" x="358" y="382">Processing and label</text><text class="s" x="358" y="410">Impute · scale · one-hot</text><text class="s" x="358" y="432">Training-fold 10th percentile</text><text class="s" x="358" y="454">defines proxy failure</text>
  <path class="arrow" d="M580 422H632"/>
  <rect class="card" x="644" y="351" width="230" height="142" rx="14"/>
  <text class="t" x="664" y="382">Models and evaluation</text><text class="s" x="664" y="410">Dummy · Logistic · CatBoost</text><text class="s" x="664" y="432">Random three-fold validation</text><text class="s" x="664" y="454">PR-AUC and classification metrics</text>
  <path class="arrow" d="M886 422H938"/>
  <rect class="out" x="950" y="351" width="208" height="142" rx="14"/>
  <text class="t" x="970" y="382">Proxy outputs</text><text class="s" x="970" y="410">Proxy-failure probability</text><text class="s" x="970" y="432">PR-AUC · F1 · MCC</text><text class="s" x="970" y="454">Threshold provenance</text>

  <text class="lane" x="42" y="558">Device lifetime analysis</text>
  <text class="tag" x="1158" y="558" text-anchor="end">NASA MOSFET stress evidence</text>
  <rect class="life" x="42" y="576" width="220" height="142" rx="14"/>
  <text class="t" x="62" y="607">Input</text><text class="s" x="62" y="635">MOSFET degradation tracks</text><text class="s" x="62" y="657">Stress temperature</text><text class="s" x="62" y="679">Failure and right censoring</text>
  <path class="arrow" d="M274 647H326"/>
  <rect class="card" x="338" y="576" width="230" height="142" rx="14"/>
  <text class="t" x="358" y="607">Reliability processing</text><text class="s" x="358" y="635">Source and event-time audit</text><text class="s" x="358" y="657">Device-isolated split</text><text class="s" x="358" y="679">Temperature stress groups</text>
  <path class="arrow" d="M580 647H632"/>
  <rect class="card" x="644" y="576" width="230" height="142" rx="14"/>
  <text class="t" x="664" y="607">Models and evaluation</text><text class="s" x="664" y="635">Weibull · Arrhenius–Weibull</text><text class="s" x="664" y="657">Random survival forest</text><text class="s" x="664" y="679">Fit and held-out metrics</text>
  <path class="arrow" d="M886 647H938"/>
  <rect class="out" x="950" y="576" width="208" height="142" rx="14"/>
  <text class="t" x="970" y="607">Reliability outputs</text><text class="s" x="970" y="635">B10 · η · survival prediction</text><text class="s" x="970" y="657">Use-temperature estimates</text><text class="s" x="970" y="679">RSF predictive metrics</text>
</svg>
